services:
  postgres:
    image: postgres:16-alpine
    container_name: medikiosk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medikiosk
      POSTGRES_PASSWORD: medikiosk
      POSTGRES_DB: medikiosk
    ports:
      - '5432:5432'
    volumes:
      - medikiosk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medikiosk']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medikiosk-postgres-data:
